<div class="card book-card h-100">
    <div class="card-img-top bg-light d-flex align-items-center justify-content-center" style="height: 200px;">
        {% if book.cover_image %}
        <img src="{{ url_for('static', filename=book.cover_image) }}" class="img-fluid h-100" alt="{{ book.title }}">
        {% else %}
        <i class="bi bi-book text-secondary" style="font-size: 4rem;"></i>
        {% endif %}
    </div>
    <div class="card-body">
        <h6 class="card-title text-truncate" title="{{ book.title }}">{{ book.title }}</h6>
        <p class="card-text text-muted small mb-1">{{ book.author }}</p>
        {% if book.category %}
        <span class="badge bg-info text-dark">{{ book.category.name }}</span>
        {% endif %}
        <span class="badge {{ 'bg-success' if book.is_available else 'bg-danger' }}">
            {{ '可借' if book.is_available else '已借完' }}
        </span>
    </div>
    <div class="card-footer bg-transparent">
        <small class="text-muted">库存: {{ book.available_copies }}/{{ book.total_copies }}</small>
    </div>
</div>
