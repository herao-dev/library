{% macro status_badge(status) %}
{% if status == 'borrowed' %}
<span class="badge bg-primary">借出</span>
{% elif status == 'returned' %}
<span class="badge bg-success">已还</span>
{% elif status == 'overdue' %}
<span class="badge bg-danger">逾期</span>
{% else %}
<span class="badge bg-secondary">{{ status }}</span>
{% endif %}
{% endmacro %}
